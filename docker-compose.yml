services:

  web:
    image: php:8.2-apache
    container_name: contenedor_php_apache
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: contenedor_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: registro_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

